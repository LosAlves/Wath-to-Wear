<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What should I wear? / Que porter ? / O que vestir?</title>
<style>
:root{
  --bg:#dff1ff; --card:#ffffff; --ink:#0b2545; --line:#9cc3e4;
  --ok:#1e8e5a; --okink:#ffffff; --sun:#ffc93c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b1b2e; --card:#14304d; --ink:#f2f7ff; --line:#3b6a96; --ok:#5fd99b; --okink:#0b2545; color-scheme:dark}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Verdana,"Atkinson Hyperlegible",Arial,sans-serif;font-size:22px;line-height:1.3}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px;text-align:center}
h1{font-size:2.2rem;line-height:1.15;margin:8px 0 18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:6px solid var(--sun);outline-offset:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:grid;grid-template-columns:1fr;gap:14px}
.choice{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--card);border:5px solid var(--line);border-radius:28px;padding:10px;font-weight:700;font-size:1.6rem}
.stack .choice{min-height:140px;flex-direction:row;gap:20px}
.choice .ic{font-size:4.6rem;line-height:1}
.choice:active{background:var(--sun);color:#0b2545;border-color:var(--ink)}
.card{background:var(--card);border:5px solid var(--line);border-radius:32px;padding:20px 12px;margin-bottom:18px}
.card .ic{font-size:9rem;line-height:1.1;display:block}
.card .lbl{font-size:2.4rem;font-weight:700;display:block;margin-top:4px}
.pair{display:flex;justify-content:center;gap:18px}
.pair .ic{font-size:6.5rem}
.go{width:100%;min-height:96px;border-radius:32px;border:5px solid var(--ok);background:var(--ok);color:var(--okink);font-weight:700;font-size:2rem}
.small{min-height:68px;padding:8px 22px;border-radius:999px;border:4px solid var(--ink);background:var(--card);font-weight:700;font-size:1.3rem}
.say{background:var(--sun);color:#0b2545}
.lang{min-height:48px;font-size:1rem;padding:4px 16px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.langsel{font:inherit;font-weight:700;font-size:1rem;min-height:48px;padding:4px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);max-width:60vw}
.unit{display:flex;gap:8px}
.lang[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#app.muted .say{display:none}
.outgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.otile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:124px;padding:10px 4px;background:var(--card);border:4px solid var(--line);border-radius:20px;font-weight:700;font-size:.95rem;line-height:1.15}
.tic{display:flex;justify-content:center;gap:2px;font-size:2.8rem;line-height:1}
.hint{background:var(--card);border:4px dashed var(--line);border-radius:20px;padding:12px 16px;margin:0 0 14px;font-size:1rem;text-align:left}
.tbadge{position:sticky;top:6px;z-index:5;display:flex;align-items:center;justify-content:center;gap:14px;width:fit-content;margin:0 auto 14px;padding:6px 20px;border:4px solid var(--ink);border-radius:999px;font-weight:700;font-size:1.6rem}
.vname{font-size:.95rem;opacity:.85;margin:0 0 8px;text-align:center}
.unit [aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.scale{display:grid;gap:8px}
.tile{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:76px;padding:6px 24px;border:5px solid var(--ink);border-radius:20px;font:inherit;font-weight:700;font-size:2rem}
.tile .face{font-size:2.4rem;line-height:1}
.row{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.dots{display:flex;justify-content:center;gap:10px;margin:0 0 16px}
.dot{width:20px;height:20px;border-radius:50%;border:4px solid var(--line)}
.dot.on{background:var(--ok);border-color:var(--ok)}
.dot.now{border-color:var(--ink);transform:scale(1.25)}
.party{font-size:8rem;line-height:1.1}
.spin{font-size:6rem}
@media (prefers-reduced-motion:no-preference){
  .card{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.95)}to{transform:scale(1)}}
  .spin{animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px)}}
}
</style>
</head>

    var socks=[];
    if(!shoes.pick&&shoes.k!=="sandals")socks=[I("🧦",(feel==="cold"||sky==="snowy")?"wsocks":"socks")];
    return tops.concat([bottom],socks,[shoes],ex);
  }

  function header(text){
    app.appendChild(el("h1",null,text));
    var b=el("button","small say",t().listen);b.type="button";
    b.onclick=function(){say(text,true)};
    var w=el("div",null);w.style.marginBottom="18px";w.appendChild(b);app.appendChild(w);
  }
  function choiceBtn(emo,label,onpick){
    var b=el("button","choice",'<span class="ic" aria-hidden="true">'+emo+'</span><span>'+label+'</span>');
    b.type="button";b.setAttribute("aria-label",label);
    b.onclick=onpick;
    return b;
  }
  function back(to){
    var r=el("div","row");
    var b=el("button","small",t().back);b.type="button";
    b.onclick=function(){st.step=to;render()};
    r.appendChild(b);app.appendChild(r);
  }

  function load(){
    st.err=null;st.step="load";render();
    getWeather().then(function(w){
      st.temp=w.temp;st.sky=(w.sky==="snowy"&&w.temp>=5)?"rainy":w.sky;st.feel=feelFromTemp(w.temp);st.auto=true;st.step="check";render();
    }).catch(function(e){
      st.auto=false;st.err=(e&&e.code===1)?"errDenied":"errOther";st.step="temp";render();
    });
  }

  function render(){
    var L=t();
    document.documentElement.lang=(lang==="pt"?"pt-PT":lang);
    app.innerHTML="";
    app.className=muted?"muted":"";
    var top=el("div","top");
    var ug=el("div","unit");
    ["C","F"].forEach(function(u){
      var ub=el("button","small lang","°"+u);ub.type="button";
      ub.setAttribute("aria-pressed",String(unit===u));
      ub.onclick=function(){unit=u;try{localStorage.setItem("wtw-unit",u)}catch(e){}render()};
      ug.appendChild(ub);
    });
    top.appendChild(ug);
    var vn=null;
    if(!muted&&voicesFor(lang).length>1){
      var vb=el("button","small lang","🗣️");vb.type="button";vb.setAttribute("aria-label",L.voice);
      vb.onclick=function(){
        var list=voicesFor(lang),cur=currentVoice(),nx=list[(list.indexOf(cur)+1)%list.length];
        try{localStorage.setItem("wtw-voice-"+lang,nx.name)}catch(e){}
        if(vn)vn.textContent="🗣️ "+nx.name;
        say(L.sample,true);
      };
      top.appendChild(vb);
      vn=el("div","vname","🗣️ "+currentVoice().name);
    }
    var mb=el("button","small lang",muted?"🔇":"🔊");mb.type="button";
    mb.setAttribute("aria-pressed",String(muted));mb.setAttribute("aria-label",muted?L.unmute:L.mute);
    mb.onclick=function(){muted=!muted;try{localStorage.setItem("wtw-mute",muted?"1":"0")}catch(e){}try{if(muted)speechSynthesis.cancel()}catch(e){}render()};
    top.appendChild(mb);
    var lg=el("select","langsel");lg.setAttribute("aria-label",L.langLabel);
    [["auto",L.autoLang],["en","English"],["fr","Français"],["pt","Português (Portugal)"]].forEach(function(o){
      var op=el("option",null,o[1]);op.value=o[0];if(o[0]===langSetting)op.selected=true;lg.appendChild(op);
    });
    lg.onchange=function(){
      langSetting=lg.value;lang=langSetting==="auto"?deviceLang():langSetting;
      try{localStorage.setItem("wtw-lang",langSetting)}catch(e){}
      render();
    };
    top.appendChild(lg);app.appendChild(top);if(vn)app.appendChild(vn);
    if((st.step==="sky"||st.step==="suggest"||st.step==="dress")&&st.temp!=null)badge();

    if(st.step==="load"){
      app.appendChild(el("div","spin","🌍"));
      app.appendChild(el("h1",null,L.loading));
    }
    else if(st.step==="check"){
      var txt=L.sentence(L.sky[st.sky][1],L.feel[st.feel][1]);
      app.appendChild(el("h1",null,L.today));
      app.appendChild(el("div","card",'<span class="pair"><span class="ic" aria-hidden="true">'+emoji(SKY,st.sky)+'</span><span class="ic" aria-hidden="true">'+emoji(FEEL,st.feel)+'</span></span><span class="lbl">'+fmt(st.temp)+'°'+unit+'</span>'));
      var go=el("button","go",L.seeOutfit);go.type="button";
      go.onclick=function(){st.chosen={};st.i=0;st.step="suggest";render()};
      app.appendChild(go);
      var r=el("div","row");
      var ls=el("button","small say",L.listen);ls.type="button";
      ls.onclick=function(){say(txt,true)};
      var ch=el("button","small",L.notright);ch.type="button";
      ch.onclick=function(){st.auto=false;st.step="temp";render()};
      r.appendChild(ls);r.appendChild(ch);app.appendChild(r);
    }
    else if(st.step==="sky"){
      header(L.skyQ);
      var g=el("div","grid");
      var skies=SKY.filter(function(c){return c[0]!=="snowy"||st.temp<5});
      skies.forEach(function(c){g.appendChild(choiceBtn(c[1],L.sky[c[0]][0],function(){
        st.chosen={};st.sky=c[0];st.i=0;st.step="suggest";render();
      }))});
      if(skies.length%2)g.lastChild.style.gridColumn="1 / -1";
      app.appendChild(g);
      back("temp");
      var rr=el("div","row");
      var again=el("button","small",L.check);again.type="button";
      again.onclick=load;rr.appendChild(again);app.appendChild(rr);
    }
    else if(st.step==="start"){
      header(L.startQ);
      var sg=el("div","stack");
      sg.appendChild(choiceBtn("🌍",L.autoBtn,function(){load()}));
      sg.appendChild(choiceBtn("🌡️",L.manualBtn,function(){st.err=null;st.auto=false;st.step="temp";render()}));
      app.appendChild(sg);
    }
    else if(st.step==="temp"){
      header(L.tempQ);
      /*LIVE*/if(st.err)app.appendChild(el("div","hint",L[st.err]));/*ENDLIVE*/
      var sc=el("div","scale");
      TEMPS.forEach(function(x){
        var b=el("button","tile",'<span>'+fmt(x.c)+'°'+unit+'</span><span class="face" aria-hidden="true">'+x.f+'</span>');
        b.type="button";b.style.background=x.bg;b.style.color=x.fg;
        b.setAttribute("aria-label",fmt(x.c)+" "+L.deg);
        b.onclick=function(){st.chosen={};st.temp=x.c;st.feel=feelFromTemp(x.c);st.step="sky";say(fmt(x.c)+" "+L.deg);render()};
        sc.appendChild(b);
      });
      app.appendChild(sc);
      /*LIVE*/var rt=el("div","row");var bt=el("button","small",L.back);bt.type="button";bt.onclick=function(){st.step="start";render()};var wt=el("button","small",L.check);wt.type="button";wt.onclick=load;rt.appendChild(bt);rt.appendChild(wt);app.appendChild(rt);/*ENDLIVE*/
    }
    else if(st.step==="suggest"){
      var sl=outfit(st.sky,st.feel,st.temp);
      var nm=function(x){return x.pick?x.pick.map(function(p){return L.it[p.k]}).join(" / "):L.it[x.k]};
      var line=L.sentence(L.sky[st.sky][1],L.feel[st.feel][1])+" "+L.suggestSay+sl.map(nm).join(", ")+".";
      header(L.suggestQ);
      var wg=el("div","outgrid");
      sl.forEach(function(x){
        var icons=(x.pick?x.pick:[x]).map(function(p){return '<span>'+p.i+'</span>'}).join("");
        wg.appendChild(el("div","otile",'<span class="tic" aria-hidden="true">'+icons+'</span><span>'+nm(x)+'</span>'));
      });
      app.appendChild(wg);
      var gd=el("button","go",L.go);gd.type="button";
      gd.onclick=function(){st.i=0;st.step="dress";render()};
      app.appendChild(gd);
      var rs2=el("div","row");
      var bs=el("button","small",L.back);bs.type="button";
      bs.onclick=function(){st.step=st.auto?"check":"sky";render()};
      var ls3=el("button","small say",L.listen);ls3.type="button";
      ls3.onclick=function(){say(line,true)};
      rs2.appendChild(bs);rs2.appendChild(ls3);app.appendChild(rs2);
      say(line);
    }
    else{
      var raw=outfit(st.sky,st.feel,st.temp);
      var list=raw.map(function(x,k){return x.pick?(st.chosen[k]||x):x});
      if(st.i>=list.length){
        app.appendChild(el("div","party","🎉"));
        app.appendChild(el("h1",null,L.done));
        var rs=el("button","go",L.again);rs.type="button";
        rs.onclick=function(){st.step="start";render()};
        app.appendChild(rs);
        say(L.done);
        return;
      }
      var dots=el("div","dots");
      list.forEach(function(_,k){dots.appendChild(el("span","dot"+(k<st.i?" on":"")+(k===st.i?" now":"")))});
      app.appendChild(dots);
      var it=list[st.i];
      if(it.pick){
        header(L[it.q||"pickTop"]);
        var pg=el("div","grid");
        it.pick.forEach(function(p){pg.appendChild(choiceBtn(p.i,L.it[p.k],function(){st.chosen[st.i]=p;say(L.it[p.k]);st.i++;render()}))});
        app.appendChild(pg);
        var rp=el("div","row");
        var bp=el("button","small",L.back);bp.type="button";
        bp.onclick=function(){if(st.i>0){st.i--;if(raw[st.i].pick)delete st.chosen[st.i]}else{st.step="suggest"}render()};
        rp.appendChild(bp);app.appendChild(rp);
        say(L[it.q||"pickTop"]);
        return;
      }
      var name=L.it[it.k];
      app.appendChild(el("div","card",'<span class="ic" aria-hidden="true">'+it.i+'</span><span class="lbl">'+name+'</span>'));
      var done=el("button","go",L.did);done.type="button";
      done.onclick=function(){st.i++;render()};
      app.appendChild(done);
      var r2=el("div","row");
      var bk=el("button","small",L.back);bk.type="button";
      bk.onclick=function(){if(st.i>0){st.i--;if(raw[st.i].pick)delete st.chosen[st.i]}else{st.step="suggest"}render()};
      var ls2=el("button","small say",L.listen);ls2.type="button";
      ls2.onclick=function(){say(L.put+name,true)};
      r2.appendChild(bk);r2.appendChild(ls2);app.appendChild(r2);
      say(L.put+name);
    }
  }
  try{speechSynthesis.onvoiceschanged=function(){if(st.step==="start"||st.step==="temp"||st.step==="sky")render()}}catch(e){}
  render();
})();
</script>
</body>
</html>
